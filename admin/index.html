<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سند بلس⁺ | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- شاشة الدخول -->
<div id="login-screen" style="position: fixed; inset: 0; background: var(--bg-base); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="card-glass" style="width: 100%; max-width: 400px; text-align: center;">
    <div class="brand-logo" style="margin: 0 auto 20px; width: 60px; height: 60px;"><i data-lucide="shield-check" size="32"></i></div>
    <h1 style="color: var(--primary-500); margin-bottom: 20px; font-size: 24px;">SANAD PLUS⁺</h1>
    <div id="login-step-1">
      <input type="text" id="login-username" class="input" placeholder="اسم المستخدم (اختياري)">
      <input type="password" id="login-password" class="input" placeholder="كلمة المرور">
      <button class="btn btn-primary" onclick="handleLogin()" style="width: 100%;">دخول</button>
    </div>
    <div id="login-step-2" style="display: none;">
      <input type="text" id="login-otp" class="input" placeholder="------" maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 5px; font-family: var(--font-mono);">
      <button class="btn btn-primary" onclick="handleVerifyOtp()" style="width: 100%;">تأكيد</button>
    </div>
  </div>
</div>

<!-- التطبيق الرئيسي -->
<div class="app" id="main-app" style="display: none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><i data-lucide="shield-check"></i></div>
      <div><h1>سند بلس⁺</h1><p style="font-size: 11px; color: var(--text-muted);">لوحة التحكم</p></div>
    </div>
    <nav class="nav">
      <div class="nav-label">الرئيسية</div>
      <div class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')"><i data-lucide="layout-dashboard"></i> لوحة المعلومات</div>
      <div class="nav-item" data-page="inbox" onclick="switchPage('inbox')"><i data-lucide="inbox"></i> الواردات</div>
      <div class="nav-item" data-page="archive" onclick="switchPage('archive')"><i data-lucide="archive"></i> الأرشيف</div>
      <div class="nav-item" data-page="users" onclick="switchPage('users')"><i data-lucide="users"></i> المستخدمون</div>
      <div class="nav-item" data-page="support" onclick="switchPage('support')"><i data-lucide="message-square"></i> الدعم الفني</div>
      <div class="nav-item" data-page="store" onclick="switchPage('store')"><i data-lucide="shopping-bag"></i> واجهة المتجر</div>
      <div class="nav-label">النظام</div>
      <div class="nav-item" data-page="broadcast" onclick="switchPage('broadcast')"><i data-lucide="send"></i> الرسائل الجماعية</div>
      <div class="nav-item" data-page="audit" onclick="switchPage('audit')"><i data-lucide="shield-alert"></i> سجل التدقيق</div>
      <div class="nav-item" data-page="settings" onclick="switchPage('settings')"><i data-lucide="settings"></i> الإعدادات</div>
    </nav>
    <div style="padding: 16px; border-top: 1px solid var(--border-soft);">
      <button class="btn btn-danger" onclick="logout()" style="width: 100%;"><i data-lucide="log-out"></i> خروج</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title"><h2 id="page-title">لوحة المعلومات</h2><p id="page-date"></p></div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="togglePrivacy()" title="إخفاء/إظهار البيانات"><i data-lucide="eye" id="privacy-icon"></i></button>
        <button class="icon-btn" onclick="toggleTheme()" title="تبديل المظهر"><i data-lucide="sun-moon" id="theme-icon"></i></button>
        
        <!-- جرس الإشعارات -->
        <div style="position: relative;">
          <button class="icon-btn" onclick="toggleNotifications(event)">
            <i data-lucide="bell"></i>
            <span id="notif-dot" style="position:absolute; top:8px; right:8px; width:8px; height:8px; background:var(--error); border-radius:50%; display:none;"></span>
          </button>
          <div id="notif-dropdown" class="card-glass" style="display:none; position:absolute; top:50px; left:0; width:300px; z-index:100; padding:15px; box-shadow:var(--shadow-lg);">
            <h4 style="margin-bottom:10px; font-size:14px;">الإشعارات</h4>
            <div id="notif-list" style="font-size:13px; color:var(--text-muted);">لا توجد إشعارات جديدة.</div>
          </div>
        </div>
      </div>
    </header>

    <!-- هنا سيتم حقن محتوى الصفحات عبر JavaScript -->
    <div class="content" id="page-content"></div>
  </div>
</div>

<!-- حاوية المودالات -->
<div id="modals-container"></div>
<div id="toast">تمت العملية</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
