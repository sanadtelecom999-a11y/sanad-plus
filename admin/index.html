<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SANAD+ | لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          colors: {
            bg: '#0f172a', card: '#1e293b',
            primary: '#38bdf8', success: '#10b981', danger: '#ef4444',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #fff; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    html.light body { background: #f1f5f9 !important; color: #0f172a; }
    html.light .glass { background: rgba(255, 255, 255, 0.85); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

</head>
<body class="min-h-screen">

  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md border border-white/10 shadow-2xl">
      <h1 class="text-3xl font-bold text-center mb-2">SANAD<span class="text-primary">+</span></h1>
      <p class="text-center text-slate-400 text-sm mb-8">لوحة التحكم الإدارية</p>

      <form id="login-form" class="space-y-4" novalidate>
        <div id="password-group">
          <label class="block text-sm mb-2">كلمة المرور</label>
          <input id="password-input" type="password" required autocomplete="current-password"
                 class="w-full bg-slate-900/50 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-primary text-white" />
        </div>

        <div id="otp-group" style="display: none;">
          <label class="block text-sm mb-2">رمز OTP</label>
          <input id="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code"
                 class="w-full bg-slate-900/50 border border-white/10 rounded-lg px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:border-primary text-white"
                 placeholder="------" maxlength="6" />
          <p class="text-xs text-slate-500 mt-2">الرمز يظهر في سجلات Render</p>
        </div>

        <div id="login-error" class="text-danger text-sm min-h-[20px] text-center"></div>

        <button id="login-submit" type="submit"
                class="w-full bg-primary hover:bg-sky-400 text-slate-900 font-bold py-3 rounded-lg transition disabled:opacity-50">
          دخول
        </button>
      </form>
    </div>
  </div>

  <div id="app-shell" style="display: none;" class="min-h-screen flex-col">
    <header class="glass border-b border-white/10 p-4 flex items-center justify-between sticky top-0 z-40">
      <div class="flex items-center gap-3">
        <h2 class="text-xl font-bold">SANAD<span class="text-primary">+</span></h2>
        <span class="text-slate-400 text-sm hidden sm:inline">— لوحة التحكم</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="theme-toggle" title="تبديل الوضع"
                class="px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 transition">🌓</button>
        <button id="logout-btn"
                class="px-3 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition">خروج</button>
      </div>
    </header>

        
    <!-- شريط التنقل -->
    <div class="bg-card/50 border-b border-white/10 px-6 py-2 flex gap-4 overflow-x-auto">
      <button onclick="window.location.hash='#dashboard'" class="text-slate-300 hover:text-primary transition pb-2 border-b-2 border-transparent hover:border-primary">لوحة التحكم</button>
      <button onclick="window.location.hash='#inbox'" class="text-slate-300 hover:text-primary transition pb-2 border-b-2 border-transparent hover:border-primary">الإرساليات (Inbox)</button>
    </div>
<main class="flex-1 p-6 overflow-y-auto">
      <div id="dashboard-container">
        <!-- سيتم حقن لوحة التحكم هنا -->
        <div class="text-center text-slate-400 mt-20">جاري تحميل الإحصائيات...</div>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js?v=4"></script>

  <!-- Modal للإرساليات -->
  <div id="detail-modal" style="display: none;" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="glass rounded-2xl p-6 w-full max-w-lg border border-white/20 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="window.closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-2xl">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

</body>
</html>
