<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANAD PLUS+ | لوحة التحكم</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: '#0f172a', card: '#1e293b', primary: '#10b981', danger: '#ef4444', accent: '#38bdf8', warning: '#f59e0b' }, fontFamily: { sans: ['Cairo', 'sans-serif'] } } }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .bento-card { transition: transform 0.2s ease; }
        .bento-card:hover { transform: translateY(-2px); }
        .input-field { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 0.75rem; border-radius: 0.75rem; outline: none; }
        .input-field:focus { border-color: #38bdf8; }
        .btn-primary { width: 100%; background: #38bdf8; color: #0f172a; font-weight: bold; padding: 0.75rem; border-radius: 0.75rem; border: none; cursor: pointer; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-success { width: 100%; background: #10b981; color: white; font-weight: bold; padding: 0.75rem; border-radius: 0.75rem; border: none; cursor: pointer; }
        .inbox-tab.active { background: #38bdf8; color: #0f172a; }
        .nav-btn.active { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border-right: 3px solid #38bdf8; }
        .inbox-card { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 1.5rem; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; cursor: pointer; }
        .inbox-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.75rem; margin-bottom: 0.25rem; }
        .admin-note-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 0.75rem; border-radius: 0.5rem; font-family: inherit; resize: vertical; min-height: 80px; outline: none; }
        .btn-reject { flex: 1; background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; padding: 0.75rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
        .btn-complete { flex: 1; background: #10b981; color: white; border: none; padding: 0.75rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row font-sans">

    <div id="loginScreen" class="fixed inset-0 bg-dark z-50 flex items-center justify-center">
        <div class="glass p-8 rounded-3xl w-96 text-center border-t-4 border-t-accent" style="background:#1e293b;">
            <div class="text-accent font-bold text-3xl mb-2 tracking-wider">SANAD+</div>
            <p class="text-slate-400 text-sm mb-8">تسجيل دخول الإدارة</p>
            <div id="loginStep1">
                <input type="text" id="loginUser" placeholder="اسم المستخدم" class="input-field mb-4" value="admin">
                <input type="password" id="loginPass" placeholder="كلمة المرور" class="input-field mb-6">
                <button onclick="handleLogin()" id="loginBtn" class="btn-primary">تسجيل الدخول</button>
            </div>
            <div id="loginStep2" class="hidden">
                <p class="text-slate-400 mb-4 text-sm">تم إرسال رمز التحقق إلى حسابك في تليجرام.</p>
                <input type="text" id="otpCode" placeholder="000000" class="input-field mb-4 text-center tracking-widest text-xl font-mono">
                <button onclick="verifyOTP()" id="otpBtn" class="btn-success">تأكيد الرمز</button>
            </div>
        </div>
    </div>

    <div id="dashboardScreen" class="hidden w-full h-full flex">
        <aside class="w-64 glass border-l border-slate-700/50 flex-col py-6 z-10 h-full overflow-y-auto scrollbar-hide hidden md:flex">
            <div class="text-accent font-bold text-2xl mb-8 px-6 tracking-wider">SANAD+</div>
            <nav class="flex flex-col gap-1 w-full px-3 mb-6">
                <button onclick="switchSection('dashboard', this)" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700/50 text-white transition active"><i data-lucide="layout-dashboard" size="20"></i> <span class="font-bold">لوحة التحكم</span></button>
                <button onclick="switchSection('inbox', this)" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700/50 text-slate-400 transition"><i data-lucide="inbox" size="20"></i> <span class="font-bold">الإرساليات</span></button>
            </nav>
            <nav class="flex flex-col gap-1 w-full px-3 pb-6 mt-auto">
                <button onclick="logout()" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-red-500/20 text-red-400 transition"><i data-lucide="log-out" size="20"></i> <span class="font-bold">تسجيل خروج</span></button>
            </nav>
        </aside>

        <main class="flex-1 h-full overflow-y-auto pb-20 md:pb-0 relative">
            <header class="sticky top-0 z-20 glass flex justify-between items-center p-4 md:p-6 border-b border-slate-700/50">
                <h2 id="page-title" class="text-2xl font-bold">لوحة التحكم</h2>
                <div class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center text-accent font-bold">A</div>
            </header>

            <div class="p-4 md:p-8">
                <section id="section-dashboard" class="content-section block">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div class="glass bento-card rounded-3xl p-6 border-r-4 border-r-accent"><h3 class="text-slate-400 text-sm mb-1">إجمالي الطلبات</h3><div class="text-3xl font-bold" id="statOrders">0</div></div>
                        <div class="glass bento-card rounded-3xl p-6 border-r-4 border-r-primary"><h3 class="text-slate-400 text-sm mb-1">الإيرادات المحققة</h3><div class="text-3xl font-bold" id="statRevenue">$0.00</div></div>
                        <div class="glass bento-card rounded-3xl p-6 border-r-4 border-r-warning"><h3 class="text-slate-400 text-sm mb-1">الإيداعات المعتمدة</h3><div class="text-3xl font-bold" id="statDeposits">0</div></div>
                        <div class="glass bento-card rounded-3xl p-6 border-r-4 border-r-emerald-500"><h3 class="text-slate-400 text-sm mb-1">إجمالي المستخدمين</h3><div class="text-3xl font-bold" id="statUsers">0</div></div>
                    </div>
                    <div class="glass rounded-3xl p-6 h-80"><canvas id="dashboardChart"></canvas></div>
                </section>

                <section id="section-inbox" class="content-section hidden">
                    <div class="flex gap-2 mb-6">
                        <button onclick="switchInboxTab('orders', this)" class="inbox-tab glass px-6 py-2 rounded-xl text-sm font-bold transition bg-accent text-dark active">الطلبات</button>
                        <button onclick="switchInboxTab('deposits', this)" class="inbox-tab glass px-6 py-2 rounded-xl text-sm font-bold transition text-slate-400">الإيداعات</button>
                    </div>
                    <div id="inboxContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </section>
            </div>
        </main>
    </div>

    <div id="detailsModal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center backdrop-blur-sm p-4">
        <div class="glass w-full max-w-lg rounded-3xl border border-slate-700 overflow-hidden flex flex-col max-h-[90vh]" style="background:#1e293b;">
            <div class="flex justify-between items-center p-5 border-b border-slate-700 bg-slate-800/50">
                <h3 id="modalTitle" class="text-xl font-bold">تفاصيل</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" size="24"></i></button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto text-slate-300 space-y-4"></div>
            <div id="modalFooter" class="p-5 border-t border-slate-700 bg-slate-800/50 flex flex-col gap-3"></div>
        </div>
    </div>

    <script src="app.js?v=999"></script>
</body>
</html>
