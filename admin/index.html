<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1426">
<title>SANAD PLUS⁺ | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css?v=2">
<style>
:root{--bg:#0a1426;--panel:#101f35;--line:rgba(125,180,225,.16);--text:#f3f8ff;--muted:#91a7c2;--blue:#38bdf8;--radius:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 8% 0%,rgba(14,116,144,.13),transparent 42%);overflow:hidden}
#login-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 16px; }
.login-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.login-box input { width: 100%; background: #0b1b2f; border: 1px solid var(--line); border-radius: 8px; padding: 12px; color: white; margin-bottom: 16px; outline: none; box-sizing: border-box; }
.login-btn { width: 100%; background: var(--blue); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; }
#app-shell { display: none; height: 100vh; width: 100%; }
.sidebar{position:fixed;inset:0 0 0 auto;width:248px;padding:18px 14px;background:rgba(8,20,38,.98);border-left:1px solid var(--line);z-index:30;overflow-y:auto;transition:transform .25s}
.brand{display:flex;align-items:center;gap:11px;padding:8px 7px 20px;border-bottom:1px solid var(--line)}.brand-mark{width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--blue);color:var(--blue);font-size:21px;font-weight:800;border-radius:14px;background:linear-gradient(145deg,#143b60,#0a1b30);box-shadow:0 0 22px #38bdf822}.brand-name{font-size:18px;font-weight:800;line-height:1.3}.brand-sub{font-size:11px;color:var(--muted)}
.nav-group{margin-top:18px}.nav-label{font-size:11px;font-weight:800;color:var(--blue);padding:0 11px 7px}.nav-link{width:100%;display:flex;align-items:center;gap:11px;text-align:right;padding:10px 11px;margin:2px 0;border:1px solid transparent;border-radius:11px;background:transparent;color:#c4d3e6;font-size:13px;text-decoration:none;cursor:pointer}.nav-link svg{width:18px;height:18px;color:#9cc9ed}.nav-link:hover,.nav-link.active{background:linear-gradient(90deg,#0ea5e926,#0ea5e908);border-color:#38bdf833;color:white}.nav-link.active svg{color:var(--blue)}
.main{margin-right:248px;min-width:0;height:100vh;display:flex;flex-direction:column}.topbar{min-height:66px;padding:11px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#0a1426d9;position:sticky;top:0;z-index:15;backdrop-filter:blur(14px)}.menu-btn{display:none}.top-actions{display:flex;align-items:center;gap:8px;margin-right:auto}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#10223a;color:#cce7ff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.content{max-width:1500px;margin:auto;padding:23px 24px 28px;flex:1;overflow-y:auto;width:100%}
#detail-modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:80;backdrop-filter:blur(4px)}#detail-modal.show{display:flex}.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:#0d1c30;border:1px solid #38bdf84d;border-radius:18px;box-shadow:0 20px 70px #0008}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:15px}.close-btn{border:1px solid var(--line);background:#152c46;color:white;border-radius:8px;width:32px;height:32px;cursor:pointer}.modal-body{padding:18px}
@media(max-width:720px){.sidebar{transform:translateX(105%);box-shadow:-20px 0 50px #0006}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.menu-btn{display:block;width:37px;height:37px;border:1px solid var(--line);border-radius:10px;background:#10223a;color:var(--blue);font-size:18px;flex:0 0 37px}.content{padding:17px 11px}.chat-container{flex-direction:column;height:auto}.chat-sidebar{width:100%;height:250px}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
</style>
</head>
<body>

<!-- 1. شاشة تسجيل الدخول -->
<div id="login-screen">
  <div class="login-box">
    <h1 style="text-align:center;margin-top:0;">SANAD<span style="color:var(--blue)">+</span></h1>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:24px;">لوحة التحكم الإدارية</p>
    <form id="login-form">
      <div id="password-group">
        <label style="font-size:12px;color:var(--muted);margin-bottom:8px;display:block;">كلمة المرور</label>
        <input id="password-input" type="password" required autocomplete="current-password" />
      </div>
      <div id="otp-group" style="display: none;">
        <label style="font-size:12px;color:var(--muted);margin-bottom:8px;display:block;">رمز OTP</label>
        <input id="otp-input" type="text" inputmode="numeric" style="text-align:center;letter-spacing:4px;font-size:20px;" maxlength="6" />
      </div>
      <div id="login-error" style="color:#fb7185;font-size:12px;text-align:center;margin-bottom:12px;min-height:18px;"></div>
      <button id="login-submit" type="submit" class="login-btn">دخول</button>
    </form>
  </div>
</div>

<!-- 2. شل التطبيق -->
<div id="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">S⁺</div>
      <div><div class="brand-name">SANAD PLUS⁺</div><div class="brand-sub">لوحة الإدارة</div></div>
    </div>
    <nav id="navigation">
      <div class="nav-group"><div class="nav-label">الرئيسية</div>
        <a class="nav-link" href="#dashboard" data-page="dashboard"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>لوحة التحكم</a>
      </div>
      <div class="nav-group"><div class="nav-label">العمليات</div>
        <a class="nav-link" href="#inbox" data-page="inbox"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>الإرساليات (Inbox)</a>
        <a class="nav-link" href="#support" data-page="support"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>تذاكر الدعم</a>
        <a class="nav-link" href="#archive" data-page="archive"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>الأرشيف</a>
      </div>
      <div class="nav-group"><div class="nav-label">المتجر والمستخدمين</div>
        <a class="nav-link" href="#users" data-page="users"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>إدارة المستخدمين</a>
        <a class="nav-link" href="#store" data-page="store"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>المتجر والمنتجات</a>
      </div>
      <div class="nav-group"><div class="nav-label">النظام</div>
        <a class="nav-link" href="#settings" data-page="settings"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>الإعدادات العامة</a>
      </div>
    </nav>
  </aside>
  
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 id="page-title" style="font-size:16px;margin:0;flex:1;">لوحة التحكم</h1>
      <div class="top-actions">
        <button class="icon-btn" id="theme-toggle" title="تغيير المظهر">☾</button>
        <button class="icon-btn" id="logout-btn" title="تسجيل الخروج" style="color:#fb7185;">⇥</button>
      </div>
    </header>
    
    <div class="content">
      <div id="dashboard-container"></div>
    </div>
  </div>
</div>

<!-- 3. المودال العام -->
<div id="detail-modal">
  <section class="modal">
    <header class="modal-head">
      <h3 id="modal-title">تفاصيل</h3>
      <button class="close-btn" onclick="window.closeModal()">×</button>
    </header>
    <div class="modal-body" id="modal-content"></div>
  </section>
</div>

<script type="module" src="js/main.js?v=150"></script>
</body>
</html>
