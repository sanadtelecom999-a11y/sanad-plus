<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANAD PLUS+ | لوحة التحكم</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SweetAlert2 للنوافذ المنبثقة -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        primary: '#10b981',
                        danger: '#ef4444',
                        accent: '#38bdf8'
                    },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .bento-card { transition: transform 0.2s, box-shadow 0.2s; }
        .bento-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        /* إخفاء شاشة الدخول افتراضياً */
        #loginScreen { display: none; }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="fixed inset-0 bg-dark z-50 flex items-center justify-center">
        <div class="glass p-8 rounded-2xl w-96 text-center">
            <h1 class="text-2xl font-bold mb-6 text-accent">SANAD PLUS+ | الدخول</h1>
            <input type="text" id="loginUser" placeholder="اسم المستخدم" class="w-full bg-slate-800 text-white p-3 rounded-lg mb-4 outline-none focus:ring-2 focus:ring-accent">
            <input type="password" id="loginPass" placeholder="كلمة المرور" class="w-full bg-slate-800 text-white p-3 rounded-lg mb-6 outline-none focus:ring-2 focus:ring-accent">
            <button onclick="handleLogin()" class="w-full bg-accent hover:bg-sky-400 text-dark font-bold py-3 rounded-lg transition">تسجيل الدخول</button>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <aside class="w-24 md:w-64 glass border-l border-slate-700/50 flex flex-col items-center py-6 z-10">
        <div class="text-accent font-bold text-2xl mb-10 hidden md:block">SANAD+</div>
        <nav class="flex flex-col gap-4 w-full px-2 md:px-4">
            <button onclick="switchSection('dashboard', this)" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700/50 text-slate-400 transition">
                <i data-lucide="layout-dashboard"></i> <span class="hidden md:block">الرئيسية</span>
            </button>
            <button onclick="switchSection('deposits', this)" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700/50 text-slate-400 transition">
                <i data-lucide="inbox"></i> <span class="hidden md:block">الإيداعات</span>
            </button>
            <button onclick="switchSection('orders', this)" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700/50 text-slate-400 transition">
                <i data-lucide="shopping-cart"></i> <span class="hidden md:block">الطلبات</span>
            </button>
            <button onclick="handleLogout()" class="nav-btn flex items-center gap-3 p-3 rounded-xl hover:bg-red-500/20 text-red-400 mt-auto transition">
                <i data-lucide="log-out"></i> <span class="hidden md:block">خروج</span>
            </button>
        </nav>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto relative">
        <header class="flex justify-between items-center mb-8">
            <h2 id="page-title" class="text-3xl font-bold text-white">الرئيسية</h2>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center text-accent font-bold">A</div>
            </div>
        </header>

        <!-- قسم الرئيسية (Bento Grid) -->
        <section id="section-dashboard" class="content-section block">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- كرت إحصائي كبير -->
                <div class="glass bento-card rounded-3xl p-6 md:col-span-2 flex flex-col justify-between relative overflow-hidden">
                    <div class="absolute -top-10 -left-10 w-40 h-40 bg-accent/20 rounded-full blur-3xl"></div>
                    <div>
                        <h3 class="text-slate-400 mb-2">إجمالي الإيداعات المعلقة</h3>
                        <div class="text-5xl font-bold text-white" id="totalPendingDeposits">0</div>
                    </div>
                    <div class="mt-4 flex gap-4 text-sm">
                        <span class="flex items-center gap-1 text-primary"><i data-lucide="trending-up" size="16"></i> +12% هذا الأسبوع</span>
                    </div>
                </div>
                
                <!-- كرت إحصائي صغير -->
                <div class="glass bento-card rounded-3xl p-6 flex flex-col justify-center items-center text-center">
                    <div class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center mb-4 text-primary">
                        <i data-lucide="check-circle" size="32"></i>
                    </div>
                    <h3 class="text-slate-400 mb-1">طلبات جديدة</h3>
                    <div class="text-4xl font-bold text-white" id="totalPendingOrders">0</div>
                </div>

                <!-- كرت الترحيب -->
                <div class="glass bento-card rounded-3xl p-6 md:col-span-3 flex items-center gap-4 bg-gradient-to-r from-slate-800 to-slate-900">
                    <div class="p-3 bg-accent/20 rounded-2xl text-accent"><i data-lucide="shield-check" size="28"></i></div>
                    <div>
                        <h3 class="font-bold text-lg">مرحباً بك في لوحة التحكم v3</h3>
                        <p class="text-slate-400 text-sm">النظام محمي، التصميم جديد، وجاهز لإدارة متجرك.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- قسم الإيداعات -->
        <section id="section-deposits" class="content-section hidden">
            <div id="depositsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- سيتم حقن البطاقات هنا -->
            </div>
        </section>

        <!-- قسم الطلبات -->
        <section id="section-orders" class="content-section hidden">
            <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- سيتم حقن البطاقات هنا -->
            </div>
        </section>

    </main>

    <!-- ربط الملفات -->
    <script src="js/admin_v3.js"></script>
    <script>
        // تشغيل الأيقونات
        lucide.createIcons();
    </script>
</body>
</html>
