
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANAD PLUS+ | لوحة التحكم</title>
    <link rel="stylesheet" href="css/admin_v3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar (Desktop) -->
    <aside class="sidebar">
        <h2 style="text-align:center; color:var(--primary);">SANAD+</h2>
        <nav style="margin-top: 30px; display: flex; flex-direction: column; gap: 15px;">
            <a href="#" class="btn btn-outline" style="justify-content: flex-start;"><i class="fas fa-home"></i> الرئيسية</a>

        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-size: 24px; margin: 0;">الإرساليات</h1>
            <div style="background: var(--bg-card); padding: 10px; border-radius: 50%;"><i class="fas fa-bell"></i></div>

        <div id="depositsContainer">
            <p style="text-align:center; color: var(--text-muted);">جاري تحميل البيانات...</p>
        </div>

</div>

<!-- Bottom Nav (Mobile) -->
<nav class="bottom-nav">
    <a href="#"><i class="fas fa-home fa-lg"></i> الرئيسية</a>
    <a href="#" class="active"><i class="fas fa-inbox fa-lg"></i> الإرساليات</a>
    <a href="#"><i class="fas fa-shopping-bag fa-lg"></i> الطلبات</a>
    <a href="#"><i class="fas fa-bars fa-lg"></i> المزيد</a>
</nav>

<!-- Scripts -->
<script src="js/admin_v3.js?v=2"></script>
