<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SANAD PLUS⁺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .nav-item svg, .quick-item svg, .tab-btn svg, button svg { pointer-events: none; }
  
  /* شاشة الدعم الكاملة */
  #support-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: none; flex-direction: column; }
  #support-screen.active { display: flex; }
  .chat-header { padding: 16px; background: var(--bg-card); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .chat-footer { padding: 12px; background: var(--bg-card); display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
  .chat-footer input { flex: 1; background: var(--bg-main); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 12px 16px; color: white; outline: none; }
  .chat-footer button { background: var(--primary); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>

  <div id="loading-screen" style="position:fixed; inset:0; background:var(--bg-main); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="color:var(--primary); font-size:20px; font-weight:bold;">SANAD PLUS⁺</div>
  </div>

  <main id="page-home" class="page active">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 style="font-size:20px; font-weight:800; margin:0;">SANAD<span style="color:var(--primary)">+</span></h1>
      <button id="header-support-btn" style="background:var(--bg-card); border:1px solid rgba(255,255,255,0.1); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--primary);">
        <svg style="width:20px; height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </button>
    </header>
    <div class="card" style="background: linear-gradient(145deg, #102033, #0A1B2E); border-color: rgba(0, 149, 232, 0.3);">
      <div class="card-title">الرصيد الإجمالي</div>
      <div class="balance-amount" id="home-balance">جاري التحميل...</div>
    </div>
    <button class="card" style="width:100%; display:flex; justify-content:center; align-items:center; gap:8px; color:var(--primary); font-weight:bold; background:rgba(0,149,232,0.1); border-color:var(--primary); margin-bottom:24px; cursor:pointer;">
      <svg style="width:20px; height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      طلب خدمة غير موجودة
    </button>
    <h2 style="font-size:16px; margin-bottom:16px;">تصنيفات المتجر</h2>
    <div id="home-categories" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;"></div>
  </main>

  <main id="page-products" class="page">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <button class="nav-back-btn" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&rarr;</button>
      <h1 id="category-title" style="font-size:20px; font-weight:800; margin:0;">المنتجات</h1>
    </div>
    <div id="products-container" class="products-grid"></div>
  </main>

  <main id="page-orders" class="page">
    <h1 style="font-size:20px; font-weight:800; margin-bottom:20px;">طلباتي</h1>
    <div class="tabs">
      <button class="tab-btn active" data-page="orders" data-filter="all">الكل</button>
      <button class="tab-btn" data-page="orders" data-filter="pending">قيد التنفيذ</button>
      <button class="tab-btn" data-page="orders" data-filter="completed">مكتمل</button>
      <button class="tab-btn" data-page="orders" data-filter="rejected">مرفوض</button>
    </div>
    <div id="orders-list"></div>
  </main>

  <main id="page-deposits" class="page">
    <h1 style="font-size:20px; font-weight:800; margin-bottom:20px;">الإيداعات</h1>
    <div class="tabs">
      <button class="tab-btn active" data-page="deposits" data-filter="all">الكل</button>
      <button class="tab-btn" data-page="deposits" data-filter="pending">معلقة</button>
      <button class="tab-btn" data-page="deposits" data-filter="completed">مكتملة</button>
      <button class="tab-btn" data-page="deposits" data-filter="rejected">مرفوضة</button>
    </div>
    <div id="deposits-list"></div>
  </main>

  <main id="page-account" class="page">
    <div id="account-profile"></div>
  </main>

  <main id="page-charge" class="page">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <button class="nav-back-btn" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&rarr;</button>
      <h1 style="font-size:20px; font-weight:800; margin:0;">شحن الرصيد</h1>
    </div>
    <div id="charge-methods"></div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" data-target="home"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span>الرئيسية</span></a>
    <a class="nav-item" data-target="orders"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg><span>طلباتي</span></a>
    <a class="nav-item charge-btn" data-target="charge"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></a>
    <a class="nav-item" data-target="deposits"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg><span>الإيداعات</span></a>
    <a class="nav-item" data-target="account"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span>حسابي</span></a>
  </nav>

  <!-- المودال العام -->
  <div id="app-modal" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="modal-box">
      <div class="modal-header"><h3 id="modal-title">تفاصيل</h3><button class="close-modal" onclick="document.getElementById('app-modal').classList.remove('active')">&times;</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- مودال KYC (تمت إعادته) -->
  <div id="kyc-modal" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="modal-box">
      <div class="modal-header"><h3>توثيق الحساب</h3><button class="close-modal" onclick="document.getElementById('kyc-modal').classList.remove('active')">&times;</button></div>
      <div id="kyc-body"></div>
    </div>
  </div>

  <!-- شاشة الدعم الفني (Full Screen) -->
  <div id="support-screen">
    <div class="chat-header">
      <button onclick="window.closeSupport()" style="background:none; border:none; color:white; font-size:24px;">&times;</button>
      <div><h3 style="margin:0; font-size:16px;">الدعم الفني</h3><span style="font-size:11px; color:var(--success);">متصل الآن</span></div>
    </div>
    <div id="chat-messages" class="chat-body"></div>
    <form id="chat-form" class="chat-footer">
      <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." required>
      <button type="submit">
        <svg style="width:20px; height:20px; margin:auto;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </form>
  </div>

  <!-- مودال الشراء -->
  <div id="buy-modal" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="modal-box">
      <div class="modal-header"><h3>تأكيد الشراء</h3><button class="close-modal" onclick="document.getElementById('buy-modal').classList.remove('active')">&times;</button></div>
      <div style="display:flex; gap:12px; margin-bottom:20px; background:var(--bg-main); padding:12px; border-radius:12px;">
        <img id="buy-img" style="width:60px; height:60px; border-radius:8px; object-fit:cover;">
        <div><h4 id="buy-name" style="margin:0 0 4px 0; font-size:14px;"></h4><div id="buy-price" style="font-weight:bold; color:var(--primary); font-size:16px;"></div></div>
      </div>
      <form id="buy-form">
        <div class="form-group"><label>بيانات الاستلام (ID)</label><input type="text" id="buy-delivery-data" class="form-control" required></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:16px;">
          <span style="color:var(--text-muted);">الإجمالي:</span><strong id="buy-total" style="font-size:20px; color:var(--success);"></strong>
        </div>
        <button type="submit" id="buy-submit" class="sanad-btn" style="width:100%; background:var(--primary); color:white; padding:14px; border-radius:12px; font-weight:bold; border:none;">تأكيد الدفع</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js?v=120"></script>
</body>
</html>
