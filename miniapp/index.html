<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANAD PLUS+ | المتجر</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة التحميل (Skeleton) -->
    <div id="loadingScreen" class="loading-screen">
        <div class="skeleton-header"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-grid">
            <div class="skeleton-box"></div>
            <div class="skeleton-box"></div>
            <div class="skeleton-box"></div>
            <div class="skeleton-box"></div>
        </div>
    </div>

    <!-- الشاشة الرئيسية للمتجر -->
    <div id="app" class="app-container hidden">
        
        <!-- الشريط العلوي -->
        <header class="glass-header">
            <div class="user-info" onclick="navigate('profile')">
                <div class="avatar" id="userAvatar">S</div>
                <div class="greeting">
                    <span class="hello">مرحباً،</span>
                    <span class="name" id="userName">جاري التحميل...</span>
                </div>
            </div>
            <div class="balance-badge" id="headerBalance" onclick="navigate('profile')">
                $0.00
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            
            <!-- صفحة: الرئيسية -->
            <section id="page-home" class="page active">
                <div class="bento-grid">
                    <!-- البطاقة الرئيسية للرصيد -->
                    <div class="bento-card balance-card" onclick="navigate('profile')">
                        <div class="card-icon">💳</div>
                        <div class="card-title">الرصيد الإجمالي</div>
                        <div class="card-value" id="mainBalance">$0.00</div>
                    </div>
                    
                    <!-- بطاقة الإيداع السريع -->
                    <div class="bento-card action-card" onclick="navigate('deposit')">
                        <div class="card-icon">⚡</div>
                        <div class="card-title">شحن سريع</div>
                    </div>
                </div>

                <h3 class="section-title">الأقسام</h3>
                <div id="categoriesGrid" class="categories-grid">
                    <!-- سيتم ملؤها عبر JS -->
                </div>

                <h3 class="section-title" id="productsSectionTitle" style="display:none;">المنتجات</h3>
                <div id="productsGrid" class="products-grid">
                    <!-- سيتم ملؤها عبر JS -->
                </div>
            </section>

            <!-- صفحة: طلباتي -->
            <section id="page-orders" class="page">
                <h2 class="page-title">سجل الطلبات</h2>
                <div id="ordersList" class="orders-list">
                    <div class="empty-state">لا توجد طلبات حتى الآن</div>
                </div>
            </section>

            <!-- صفحة: حسابي -->
            <section id="page-profile" class="page">
                <div class="profile-header">
                    <div class="avatar large" id="profileAvatar">S</div>
                    <h2 id="profileName">المستخدم</h2>
                    <div class="user-id" id="profileId">@username</div>
                    <div class="balance-large" id="profileBalance">$0.00</div>
                </div>
                <div class="menu-list">
                    <div class="menu-item" onclick="navigate('deposit')">
                        <span>إيداع رصيد</span>
                        <span>💳</span>
                    </div>
                    <div class="menu-item">
                        <span>توثيق الحساب (KYC)</span>
                        <span>🪪</span>
                    </div>
                    <div class="menu-item">
                        <span>الدعم الفني</span>
                        <span>🎧</span>
                    </div>
                </div>
            </section>

        </main>

        <!-- شريط التنقل السفلي -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="navigate('home')" data-target="home">
                <span class="icon">🏠</span>
                <span class="text">الرئيسية</span>
            </button>
            <button class="nav-item" onclick="navigate('orders')" data-target="orders">
                <span class="icon">📦</span>
                <span class="text">طلباتي</span>
            </button>
            <button class="nav-item" onclick="navigate('profile')" data-target="profile">
                <span class="icon">👤</span>
                <span class="text">حسابي</span>
            </button>
        </nav>
    </div>

    <!-- شاشة الحظر -->
    <div id="bannedScreen" class="overlay hidden">
        <div class="overlay-content">
            <div class="error-icon">🚫</div>
            <h2>حسابك محظور</h2>
            <p>يرجى التواصل مع الدعم الفني.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
