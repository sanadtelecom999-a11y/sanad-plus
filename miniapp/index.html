<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SANAD PLUS⁺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; background-color: #0f172a; color: white; font-family: 'Cairo', sans-serif; }
  #loading-screen { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .nav-item svg, .quick-item svg, .tab-btn svg, button svg { pointer-events: none; }
  #support-screen { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: none; flex-direction: column; }
  #support-screen.active { display: flex; }
  .chat-header { padding: 16px; background: #1e293b; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .chat-footer { padding: 12px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
  .chat-footer input { flex: 1; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 12px; color: white; outline: none; }
  .chat-footer button { background: #38bdf8; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; flex-shrink: 0; }
</style>
<script>
  // كود إنقاذ فوري: يختفي بعد 3 ثواني مهما حدث
  setTimeout(function() {
    var loader = document.getElementById('loading-screen');
    if (loader) {
      loader.style.display = 'none';
    }
  }, 3000);

  // التقاط الأخطاء
  window.addEventListener('error', function(e) {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed; top:0; left:0; right:0; background:red; color:white; z-index:99999; padding:10px; font-family:monospace;';
    el.textContent = 'JS ERROR: ' + e.message + ' at line ' + e.lineno;
    document.body.appendChild(el);
  });
</script>
</head>
<body>

  <div id="loading-screen">
    <div style="color:#38bdf8; font-size:20px; font-weight:bold;">SANAD PLUS⁺</div>
  </div>

  <main id="page-home" class="page active">
    <header style="display:flex; justify-content:space-between; padding:20px;">
      <h1 style="margin:0;">SANAD<span style="color:#38bdf8">+</span></h1>
      <button id="header-support-btn" style="background:#1e293b; border:none; border-radius:50%; width:40px; height:40px; color:#38bdf8;">💬</button>
    </header>
    <div class="card" style="margin:20px; padding:20px; background:#1e293b; border-radius:16px;">
      <div style="color:#94a3b8; font-size:12px;">الرصيد الإجمالي</div>
      <div id="home-balance" style="font-size:28px; font-weight:bold;">جاري التحميل...</div>
    </div>
    <h2 style="margin:20px;">تصنيفات المتجر</h2>
    <div id="home-categories" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:20px;"></div>
  </main>

  <!-- الصفحات الأخرى (مختصرة للاختبار) -->
  <main id="page-orders" class="page"></main>
  <main id="page-deposits" class="page"></main>
  <main id="page-account" class="page"></main>
  <main id="page-charge" class="page"></main>
  <main id="page-products" class="page"></main>

  <nav class="bottom-nav">
    <a class="nav-item active" data-target="home">الرئيسية</a>
    <a class="nav-item" data-target="orders">طلباتي</a>
    <a class="nav-item" data-target="charge">شحن</a>
    <a class="nav-item" data-target="deposits">الإيداعات</a>
    <a class="nav-item" data-target="account">حسابي</a>
  </nav>

  <div id="app-modal" class="modal-overlay"></div>
  <div id="support-screen">
    <div class="chat-header">
      <button onclick="document.getElementById('support-screen').classList.remove('active')" style="background:none; border:none; color:white; font-size:24px;">&times;</button>
      <h3>الدعم</h3>
    </div>
    <div id="chat-messages" class="chat-body"></div>
    <form id="chat-form" class="chat-footer"><input type="text" id="chat-input"><button type="submit">إرسال</button></form>
  </div>

  <script type="module" src="js/main.js?v=999"></script>
</body>
</html>
