<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SANAD PLUS⁺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="loading" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#080E1B; color:#38BDF8; font-size:20px; z-index:9999;">SANAD PLUS⁺</div>

  <main id="page-home" class="page active"></main>
  <main id="page-products" class="page"></main>
  <main id="page-orders" class="page"></main>
  <main id="page-deposits" class="page"></main>
  <main id="page-account" class="page"></main>
  <main id="page-charge" class="page"></main>
  <main id="page-referral" class="page"></main>

  <nav class="sp-bottom-nav">
    <a class="sp-nav-item active" data-target="home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>الرئيسية</span></a>
    <a class="sp-nav-item" data-target="orders"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>طلباتي</span></a>
    <a class="sp-nav-charge" data-target="charge"><svg viewBox="0 0 24 24"><path d="M13 2.05v9.95h7l-9 9.95v-9.95H4l9-9.95z"/></svg></a>
    <a class="sp-nav-item" data-target="deposits"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>الإيداعات</span></a>
    <a class="sp-nav-item" data-target="account"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>حسابي</span></a>
  </nav>

  <div id="app-modal" class="sp-modal-overlay">
    <div class="sp-modal-box">
      <button class="sp-modal-close" id="close-modal">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="support-screen">
    <div class="chat-header">
      <button id="close-support">&times;</button>
      <div><h3 style="margin:0; font-size:16px;">الدعم الفني</h3></div>
    </div>
    <div id="chat-messages" class="chat-body"></div>
    <form id="chat-form" class="chat-footer">
      <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." required>
      <button type="submit">إرسال</button>
    </form>
  </div>

  <script src="//cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
