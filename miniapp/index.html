<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://placehold.co https://t.me; connect-src 'self' https://sanad-plus-backend.onrender.com;">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <main id="app-content">
            <div id="app-loading" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#080E1B; color:#38BDF8; font-size:20px; font-weight:bold; z-index:9999;">SANAD PLUS⁺</div>
        </main>

        <nav class="bottom-nav" id="main-nav" aria-label="التنقل الرئيسي">
            <button class="nav-btn active" data-route="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>
                <span>الرئيسية</span>

            <button class="nav-btn" data-route="orders">

                <span>طلباتي</span>
            </button>
            
            <div class="nav-fab-wrapper">
                <div class="nav-fab" data-route="charge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                </div>
            </div>
            
            <button class="nav-btn" data-route="account">

            </button>
            <button class="nav-btn" onclick="openChat()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span>الدعم</span>
            </button>
        </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal"><div class="modal-head"><h2 id="modal-title">التفاصيل</h2><button class="modal-close" id="modal-close" aria-label="إغلاق">×</button></div><div id="modal-content"></div></div>
    </div>

    <script type="module" src="js/main.js?v=200"></script>
