# ============================================================
# 🔒 Database Backup — v18.4.17
# ============================================================
# • Daily at 2 AM UTC
# • pg_dump → gzip → openssl encrypt → upload artifact
# • Encrypted blob is useless without BACKUP_PASSPHRASE
# • Retention: 90 days (GitHub default)
# ============================================================
name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 Client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is empty"
            exit 1
          fi
          echo "Starting pg_dump..."
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > backup.sql.gz
          SIZE=$(stat -c%s backup.sql.gz)
          echo "backup.sql.gz size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: dump too small ($SIZE bytes) - DATABASE_URL likely wrong"
            exit 1
          fi

      - name: Verify gzip integrity
        run: |
          set -o pipefail
          gzip -t backup.sql.gz
          SIZE=$(stat -c%s backup.sql.gz)
          echo "gzip integrity OK, size: $SIZE bytes"

      - name: Encrypt backup
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "❌ BACKUP_PASSPHRASE secret missing"
            exit 1
          fi
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in backup.sql.gz \
            -out backup.sql.gz.enc \
            -pass pass:"$PASSPHRASE"
          ls -lh backup.sql.gz.enc
          echo "✅ Encrypted"

      - name: Prepare artifact name
        id: artifact
        run: |
          DATE=$(date -u +%Y%m%d_%H%M%S)
          echo "name=sanad-backup-${DATE}" >> $GITHUB_OUTPUT

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: backup.sql.gz.enc
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          SIZE=$(du -h backup.sql.gz.enc | cut -f1)
          echo "### ✅ Backup complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${{ steps.artifact.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size (encrypted):** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention:** 90 days" >> $GITHUB_STEP_SUMMARY
          echo "- **To restore:** download artifact, then run:" >> $GITHUB_STEP_SUMMARY
          echo '  ```' >> $GITHUB_STEP_SUMMARY
          echo '  openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in backup.sql.gz.enc -out backup.sql.gz -pass pass:$PASSPHRASE' >> $GITHUB_STEP_SUMMARY
          echo '  gunzip -c backup.sql.gz | psql $TARGET_DATABASE_URL' >> $GITHUB_STEP_SUMMARY
          echo '  ```' >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Backup FAILED at $(date -u)"
          exit 1
