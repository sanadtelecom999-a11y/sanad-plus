name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sanad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-lock.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install pytest-cov
      - name: Compile check
        run: python -m compileall backend/ -q
      - name: Run tests with coverage
        env:
          FLASK_ENV: testing
          SKIP_BOT: "1"
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/sanad_test"
          JWT_SECRET_KEY: "ci-test-jwt-key-32-chars-minimum-yyyyyy"
          SECRET_KEY: "ci-test-secret-key-32-chars-minimum-xxxxxx"
          ADMIN_PASSWORD_HASH: "scrypt:32768:8:1$dummyhashfortests"
          TELEGRAM_ADMIN_IDS: "123456789"
        run: pytest backend/tests/ -v --maxfail=1 --cov=backend/app --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd miniapp
          npm install
      - name: Run Vitest with coverage
        run: |
          cd miniapp
          npm run test:coverage

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 1. تثبيت متطلبات الباك اند
      - name: Install Backend Deps
        run: |
          pip install -r backend/requirements-lock.txt
      
      # 2. تشغيل الباك اند في الخلفية
      - name: Start Backend Server
        env:
          FLASK_ENV: development
          SKIP_BOT: "1"
          DATABASE_URL: "sqlite:///:memory:" # نستخدم SQLite سريعاً للاختبار
          JWT_SECRET_KEY: "ci-test-jwt-key-32-chars-minimum-yyyyyy"
          SECRET_KEY: "ci-test-secret-key-32-chars-minimum-xxxxxx"
          ADMIN_PASSWORD_HASH: "scrypt:32768:8:1$dummyhashfortests"
        run: |
          python backend/run.py > backend.log 2>&1 &
          sleep 5 # الانتظار حتى يقلع السيرفر
          
      # 3. تثبيت متطلبات الواجهة وتشغيل Playwright
      - name: Install Frontend Deps & Playwright
        run: |
          cd miniapp
          npm install
          npx playwright install --with-deps chromium
          
      # 4. تشغيل اختبار E2E
      - name: Run E2E tests
        run: |
          cd miniapp
          npm run test:e2e
