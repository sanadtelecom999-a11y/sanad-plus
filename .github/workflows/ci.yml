name: SANAD CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install flake8
      - name: Check Python Syntax
        run: flake8 backend/ bot/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test App Import (Catch NameErrors)
        run: python -c "import sys; sys.path.append('backend'); from app import create_app; create_app()"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS Syntax
        run: node --check admin/app.js
