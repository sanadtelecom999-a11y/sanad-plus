name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sanad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-lock.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
      - name: Compile check
        run: python -m compileall backend/ -q
      - name: Run tests
        env:
          FLASK_ENV: testing
          SKIP_BOT: "1"
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/sanad_test"
          JWT_SECRET_KEY: "ci-test-jwt-key-32-chars-minimum-yyyyyy"
          SECRET_KEY: "ci-test-secret-key-32-chars-minimum-xxxxxx"
          ADMIN_PASSWORD_HASH: "scrypt:32768:8:1$dummyhashfortests"
          TELEGRAM_ADMIN_IDS: "123456789"
        run: pytest backend/tests/ -v --maxfail=1

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run Vitest
        run: npm run test
