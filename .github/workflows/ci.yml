name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - run: python -m compileall backend/ -q
      - env:
          FLASK_ENV: testing
          SKIP_BOT: "1"
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "test-secret-key-for-ci-only"
          SECRET_KEY: "test-flask-secret-ci"
        run: |
          if [ -d backend/tests ] && [ "$(ls -A backend/tests/*.py 2>/dev/null)" ]; then
            pytest backend/tests/ -v --maxfail=1
          else
            echo "::warning::No tests found yet — compile check passed."
          fi
